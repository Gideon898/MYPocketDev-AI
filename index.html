<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PocketDev AI</title>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app">

  <aside class="sidebar">

    <h2>🤖 PocketDev AI</h2>

    <button class="newChat">
      + New Chat
    </button>

  </aside>

  <main class="main">

    <div id="chatBox" class="chatBox">

      <div class="welcome">
        Welcome to PocketDev AI
      </div>

    </div>

    <div class="inputArea">

      <input
        id="userInput"
        type="text"
        placeholder="Ask anything..."
      />

      <button id="sendBtn">
        Send
      </button>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
